# CuboAI dashboard — three tabs.
#
# YAML mode: edit this file, then reload from the dashboard's ⋮ menu.
#
# Deliberately NOT a copy of the CuboAI app's report screens. Total Sleep,
# Wake-ups, Longest Sleep and the sleep-routine chart are gated behind CuboAI's
# paid tier -- the app itself renders them as "Report Preview / Activate
# Ultimate to see more!", and sensor.cuboai_subscription reads `inactive`, so
# the integration cannot fetch them either. Every card below is backed by a
# reading this camera actually returns.

views:
  # ── Live ────────────────────────────────────────────────────────────────
  - title: Live
    path: live
    icon: mdi:video
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          # The camera, with the DVR scrub bar and time picker underneath it.
          - type: custom:cuboai-camera-card

      - type: grid
        cards:
          - type: heading
            heading: Right now
            heading_style: title

          - type: glance
            entities:
              - entity: sensor.cuboai_mia_cuboai_temperature_mia
                name: Temp
              - entity: sensor.cuboai_mia_cuboai_humidity_mia
                name: Humidity
              - entity: sensor.cuboai_mia_cuboai_noise_level_mia
                name: Noise

          # baby_present reads 0 for an empty room and 1/2 for in/not in crib.
          # It sat at `unknown` until the label map was found to be missing 0.
          - type: glance
            entities:
              - entity: sensor.cuboai_mia_cuboai_baby_present_mia
                name: Present
              - entity: sensor.cuboai_mia_cuboai_motion_mia
                name: Motion
              - entity: sensor.cuboai_camera_state_mia
                name: Camera

      - type: grid
        cards:
          - type: heading
            heading: Controls
            heading_style: title

          - type: tile
            entity: light.cuboai_mia_mia_night_light
            features:
              - type: light-brightness

          - type: entities
            entities:
              - entity: select.cuboai_mia_mia_night_vision
                name: Night vision
              - entity: switch.cuboai_mia_mia_sleep_mode
                name: Sleep mode
              - entity: switch.cuboai_mia_mia_status_led
                name: Status LED
              - entity: switch.cuboai_mia_mia_flip_screen
                name: Flip screen

          - type: media-control
            entity: media_player.cuboai_mia_mia_lullaby

  # ── History ─────────────────────────────────────────────────────────────
  # What the room did, from readings that are genuinely recorded. Pair this
  # with the scrub bar on the Live tab: find the hour here, watch it there.
  - title: History
    path: history
    icon: mdi:chart-timeline-variant
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Was anyone in the room
            heading_style: title

          # 0 = empty room, 1 = in crib, 2 = not in crib. Recorded properly
          # only since the sensor stopped reporting every reading as unknown.
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.cuboai_mia_cuboai_baby_present_mia
                name: Baby present
              - entity: sensor.cuboai_mia_cuboai_motion_mia
                name: Motion

          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.cuboai_mia_cuboai_noise_level_mia
                name: Noise level

      - type: grid
        cards:
          - type: heading
            heading: Room conditions
            heading_style: title

          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.cuboai_mia_cuboai_temperature_mia
                name: Temperature
              - entity: sensor.cuboai_mia_cuboai_humidity_mia
                name: Humidity

          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.cuboai_mia_cuboai_mat_bpm_mia
                name: Mat reading
              - entity: sensor.cuboai_mia_cuboai_mat_battery_mia
                name: Mat battery

  # ── Alerts ──────────────────────────────────────────────────────────────
  - title: Alerts
    path: alerts
    icon: mdi:bell-ring
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Latest
            heading_style: title

          - type: tile
            entity: sensor.cuboai_last_alert_mia
            name: Last alert

          # Replaces a hand-written markdown TABLE, which rendered as leaking
          # pipes with full-width photographs between them. A table cannot hold
          # an image on a phone; a list with a sized thumbnail can.
          #
          # Literal block (|) not folded (>): folding collapses the newlines
          # that Jinja blocks and markdown lists both depend on.
          - type: markdown
            content: |
              {% set s = 'sensor.cuboai_mia_cuboai_session_history_mia' %}
              {% set alerts = state_attr(s, 'alerts') or [] %}
              {% if alerts %}
              {% for a in alerts %}
              **{{ a.type | replace('CUBO_ALERT_', '') | title }}** ·
              {{ as_timestamp(a.time) | timestamp_custom('%a %d %b, %H:%M:%S') }}
              {% if a.image_url %}

              <img src="{{ a.image_url }}" width="220">
              {% endif %}

              ---
              {% endfor %}
              {% else %}
              **No alerts recorded yet.**

              How many are kept is set under Settings → Devices & Services →
              CuboAI → Configure (`alerts_count`).
              {% endif %}

      - type: grid
        cards:
          - type: heading
            heading: What is being watched
            heading_style: title

          - type: entities
            entities:
              - entity: sensor.cuboai_mia_cuboai_cry_detection_status_mia
                name: Cry detection
              - entity: sensor.cuboai_mia_cuboai_cough_detection_status_mia
                name: Cough detection
              - entity: sensor.cuboai_mia_cuboai_cry_sensitivity_mia
                name: Cry sensitivity
              - entity: sensor.cuboai_mia_cuboai_sleep_safety_status_mia
                name: Covered face
              - entity: sensor.cuboai_subscription
                name: Subscription

          # Says plainly why there is no sleep report here, rather than leaving
          # an empty tab that looks broken.
          - type: markdown
            content: |
              {% if states('sensor.cuboai_subscription') != 'active' %}
              **No sleep report.** CuboAI keeps Total Sleep, Wake-ups, Longest
              Sleep and the sleep-routine chart behind its paid tier — the app
              shows them as *"Report Preview — Activate Ultimate to see more"*,
              and this account reads `{{ states('sensor.cuboai_subscription') }}`.
              The History tab is built from readings the camera returns for free.
              {% endif %}
