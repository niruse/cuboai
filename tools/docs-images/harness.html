<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CuboAI docs images</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Home Assistant's default (light) theme variables, as the cards expect them. */
  :root {
    --primary-color: #03a9f4;
    --accent-color: #ff9800;
    --primary-text-color: #212121;
    --secondary-text-color: #727272;
    --disabled-text-color: #bdbdbd;
    --divider-color: rgba(0, 0, 0, 0.12);
    --card-background-color: #ffffff;
    --ha-card-background: #ffffff;
    --primary-background-color: #fafafa;
    --secondary-background-color: #e5e5e5;
    --error-color: #db4437;
    --success-color: #43a047;
    --warning-color: #ffa600;
    --state-icon-color: #44739e;
    --mdc-theme-primary: #03a9f4;
    --ha-card-border-radius: 12px;
    --ha-card-box-shadow: none;
    --ha-card-border-color: #e0e0e0;
    font-family: Roboto, "Segoe UI", Arial, sans-serif;
  }
  html, body { margin: 0; background: #eef1f5; color: var(--primary-text-color); }
  body { padding: 24px; }
  #shot { display: inline-block; }
  ha-card {
    display: block;
    background: var(--ha-card-background);
    border-radius: var(--ha-card-border-radius);
    border: 1px solid var(--ha-card-border-color);
    overflow: hidden;
  }
  ha-icon { display: inline-flex; width: 24px; height: 24px; vertical-align: middle; }
  ha-icon svg { width: 100%; height: 100%; fill: currentColor; }
</style>
</head>
<body>
<div id="shot"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
