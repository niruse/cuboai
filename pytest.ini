[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
# Lives here, not in pyproject.toml. pytest picks ONE config file and this one
# wins outright -- it says so itself: "configfile: pytest.ini (WARNING:
# ignoring pytest config in pyproject.toml!)". The setting was sitting in the
# ignored block, so it never applied. Every async test happens to carry an
# explicit @pytest.mark.asyncio, which is the only reason the suite passes; a
# new one written without the mark would not run at all, and a test that does
# not run reports as passing.
asyncio_mode = auto
