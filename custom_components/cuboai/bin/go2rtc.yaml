# Sample only. This file is REGENERATED from scratch on every start by
# Go2RTCManager._generate_config — edits here do not survive. It ships so the
# package has something to read before the first start, and to show what the
# generated config looks like when debugging.
#
# Note there is exactly ONE live-view stream per camera: cuboai_combined_<ID>
# (issue #85). A second live-view stream name would open a second concurrent
# TUTK session against the same camera, which Cubo 3 / SW05 answers with no
# tracks at all — HomeKit then shows "No Response".
api:
  listen: :1985
rtsp:
  listen: :{RTSP_PORT}
streams:
  cuboai_combined_YOUR_CAMERA_ID:
  - exec:env CUBOAI_UID=YOUR_UID CUBOAI_ACCOUNT=admin@YOUR_CAMERA_ID
    CUBOAI_PASSWORD=YOUR_PASSWORD CUBOAI_MUX_AUDIO=1 python3 /config/custom_components/cuboai/tutk/cuboai_stream_video.py#{killsignal=SIGTERM}
  - ffmpeg:cuboai_combined_YOUR_CAMERA_ID#video=copy#audio=opus#audio=aac
  - exec:env CUBOAI_UID=YOUR_UID CUBOAI_ACCOUNT=admin@YOUR_CAMERA_ID
    CUBOAI_PASSWORD=YOUR_PASSWORD CUBOAI_MUX_AUDIO=1 python3 /config/custom_components/cuboai/tutk/cuboai_stream_backchannel.py#{killsignal=SIGTERM}#backchannel=1#audio=pcma
  cuboai_speaker_YOUR_CAMERA_ID:
  - exec:env CUBOAI_UID=YOUR_UID CUBOAI_ACCOUNT=admin@YOUR_CAMERA_ID
    CUBOAI_PASSWORD=YOUR_PASSWORD CUBOAI_MUX_AUDIO=1 python3 /config/custom_components/cuboai/tutk/cuboai_stream_backchannel.py#{killsignal=SIGTERM}#backchannel=1#audio=pcma
  cuboai_dvr_YOUR_CAMERA_ID:
  - exec:env CUBOAI_UID=YOUR_UID CUBOAI_ACCOUNT=admin@YOUR_CAMERA_ID
    CUBOAI_PASSWORD=YOUR_PASSWORD CUBOAI_MUX_AUDIO=1 CUBOAI_PLAY_STATE=/config/cuboai_playback_YOUR_CAMERA_ID.json
    python3 /config/custom_components/cuboai/tutk/cuboai_stream_playback.py#{killsignal=SIGTERM}
webrtc:
  listen: :8556
