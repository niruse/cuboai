save_custom_songs:
  name: Save custom songs
  description: Save current custom songs to file

save_playlists:
  name: Save playlists
  description: Save current playlists to file

save_settings:
  name: Save card settings
  description: Save shared card settings (shuffle/repeat per camera) to file

clear_youtube_cache:
  name: Clear YouTube cache
  description: Delete all locally cached YouTube audio files (www/cuboai_cache)

set_h264_transcode:
  name: Set H.264 transcode
  description: Enable or disable H.264 transcoding for a camera (needed for HomeKit/HLS with H.265 cameras like Cubo 3). Reloads the integration.
  fields:
    device_id:
      name: Device ID
      description: The camera's device_id (from the camera entity attributes).
      required: true
      example: SW05XXXXXXXX
      selector:
        text:
    enabled:
      name: Enabled
      description: Whether to transcode this camera to H.264.
      required: true
      example: true
      selector:
        boolean:

play_recording:
  name: Play a recording
  description: >-
    Play footage from the camera's own on-board DVR on its Recording camera
    entity. No cloud subscription needed. The camera keeps roughly the last 72
    hours and serves up to about a minute behind live.
  fields:
    device_id:
      name: Camera
      description: The camera's device id.
      required: true
      example: CB02XXXXXXXXXXXX
      selector:
        text:
    start_time:
      name: Start from
      description: >-
        How far back to start — "10m", "2h", "90s" — or an absolute date and
        time.
      required: true
      example: 10m
      selector:
        text:
    duration:
      name: Duration
      description: Seconds of footage to play.
      required: false
      default: 60
      selector:
        number:
          min: 5
          max: 900
          unit_of_measurement: s
          mode: box
